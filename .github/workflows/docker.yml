name: Docker image

on:
  # Merged PRs land as pushes on main -> :develop
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - tsconfig.json
      - "*.ts"
      - app/**
      - components/**
      - lib/**
      - config/camps.example.json
      - .github/workflows/docker.yml
  # PRs (incl. Renovate): build both architectures as a check, push nothing
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - tsconfig.json
      - "*.ts"
      - app/**
      - components/**
      - lib/**
      - config/camps.example.json
      - .github/workflows/docker.yml
  # Published GitHub release -> :<release-tag> and :latest
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: lostiboy7/pfadi-app
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Emulation for the arm64 half of the build
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=develop,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
