name: Docker image

# Builds and pushes the image only after a merge or a release. Pull requests
# get the "Plan" workflow (plan.yml) instead, which shows what a merge would do.
on:
  # Merge to main that changes what ends up in the image -> :develop
  # Keep this list in sync with IMAGE_PATHS in plan.yml.
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - tsconfig.json
      - "*.ts"
      - app/**
      - components/**
      - lib/**
      - public/**
      - config/camps.example.json
  # Published GitHub release -> :<release-tag> and :latest (always built)
  release:
    types: [published]
  # Manual rebuild of :develop from main
  workflow_dispatch:

env:
  IMAGE: lostiboy7/pfadi-app

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One native runner per architecture, in parallel (no QEMU emulation).
  # Each job pushes its image by digest; the merge job combines them into
  # one multi-arch tag.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-architecture images into the final tags:
  # push to main -> :develop, release -> :<tag> (+ :latest unless pre-release)
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=develop,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          for d in *; do args+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
